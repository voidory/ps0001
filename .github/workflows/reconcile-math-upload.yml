name: Reconcile uploaded math typography files

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-math-upload.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-math-upload
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact uploaded patch and apply to canonical app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object looplab-math-typography.patch)" = d640558772303d646acf246e12f3710180f0808d
          test "$(git rev-parse HEAD:looplab-math-typography-update)" = d406b8cbff087e5ebe8a96cd576d7323456ae713
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'docs/MATH-TYPOGRAPHY.md', 'package.json', 'package-lock.json',
              'src/App.tsx', 'src/main.tsx', 'src/style.css',
              'src/presentation/StudyText.tsx', 'src/presentation/studyText.ts',
              'tests/presentation.test.ts', 'tests/e2e/typography.spec.ts',
          }
          upload = Path('looplab-math-typography-update')
          files = {str(p.relative_to(upload)) for p in upload.rglob('*') if p.is_file()}
          if files != expected:
              raise SystemExit('Unexpected upload layout; refusing to modify repository.')
          diff = subprocess.check_output(['git', 'apply', '--numstat', 'looplab-math-typography.patch'], text=True)
          targets = {line.split('\t', 2)[2] for line in diff.splitlines()}
          if targets != {'looplab/' + name for name in expected}:
              raise SystemExit('Unexpected patch targets; refusing to apply.')
          subprocess.run(['git', 'apply', '--check', 'looplab-math-typography.patch'], check=True)
          subprocess.run(['git', 'apply', 'looplab-math-typography.patch'], check=True)
          for name in expected:
              if (upload / name).read_bytes() != (Path('looplab') / name).read_bytes():
                  raise SystemExit('Patched file differs from upload: ' + name)
          print('All 10 uploaded files match their canonical application locations exactly.')
          PY
      - name: Install exact application dependencies
        working-directory: looplab
        run: npm ci --no-audit --no-fund
      - name: Verify Python, production build, lint and all unit tests
        working-directory: looplab
        run: |
          npm run test:python
          npm run build
          npm run lint
          npm test
      - name: Install Chromium
        working-directory: looplab
        run: npx playwright install --with-deps chromium
      - name: Verify production browser and typography regressions
        working-directory: looplab
        run: npm run test:e2e
      - name: Remove verified duplicate uploads and commit organized application
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- looplab-math-typography-update looplab-math-typography.patch
          git add -- looplab
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile uploaded math typography update into canonical LoopLab app'
          git push origin HEAD:main
          printf 'Organized application committed as %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain browser regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-reconciliation-browser-tests
          path: looplab/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
